<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="#" class="logo">
          <img src="images/logo.svg" alt="Logo" class="logo__img">
        </a>
        <ul class="nav__list">
          <li class="nav__item"><a href="#home" class="nav__link">Home</a></li>
          <li class="nav__item"><a href="#features" class="nav__link">Features</a></li>
          <li class="nav__item"><a href="#products" class="nav__link">Products</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="home">
      <div class="container">
        <h1 class="hero__title">Modern Solutions for Your Business</h1>
        <p class="hero__text">High-quality components built with React and Node.js.</p>
        <button class="button hero__button">Get Started</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__copy">&copy; 2026 Maxim Tsyrulnyk. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.min.js"></script>

</html>
